[package]
name = "rakko-core"
version = "0.24.1"
edition = "2021"
description = "Frontend-agnostic Kafka, Schema Registry, decode and filter logic shared by rakko's TUI and web frontends"
publish = false

[dependencies]
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "ssl-vendored", "zstd", "libz-static", "tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
apache-avro = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
